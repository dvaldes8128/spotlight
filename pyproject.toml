[project]
name = "spotlight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flake8>=7.3.0",
    "h5py>=3.15.1",
    "numpy>=2.3.5",
    "pytest>=9.0.2",
    "requests>=2.28.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "torch>=2.10.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

   [build-system]
   requires = ["setuptools>=61.0"]
   build-backend = "setuptools.build_meta"

   [tool.setuptools.packages.find]
   where = ["."]
   include = ["spotlight*"]